name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-oauth.txt
      - run: python -m unittest discover -v
      - run: python -m compileall -q babel tests
      - run: node --check web/app.js
      - run: BABEL_DOMAIN=bridge.example.invalid docker compose config --quiet
      - run: docker build -t agent-babel:ci .
      - run: BABEL_DOMAIN=bridge.example.invalid docker compose -f compose.yaml -f compose.wake.yaml config --quiet
      - run: BABEL_DOMAIN=bridge.example.invalid docker compose -f compose.yaml -f compose.wake.yaml -f compose.oauth.yaml config --quiet
      - run: docker run --rm --network none --entrypoint python agent-babel:ci -c 'import os; assert os.getuid() == 10001; import babel.gateway'
      - run: docker build -f Dockerfile.oauth -t agent-babel:oauth-ci .
      - run: docker run --rm --network none --entrypoint python agent-babel:oauth-ci -c 'import jwt, cryptography; import babel.oauth'
